name: AWS Escanor — Build and Validate

on:
  pull_request:
    paths:
      - "aws-master-reference/**"
      - ".github/workflows/aws-escanor-ci.yml"
  push:
    branches: [main]
    paths:
      - "aws-master-reference/**"
      - ".github/workflows/aws-escanor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-escanor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-tests:
    name: Python app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-master-reference/projects/escanor/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aws-master-reference/projects/escanor/app/requirements.txt
      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  terraform-validation:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-master-reference/projects/escanor/infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Show required Terraform formatting changes
        run: terraform fmt -diff -recursive
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without remote state
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate
