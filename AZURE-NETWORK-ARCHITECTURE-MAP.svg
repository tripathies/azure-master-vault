 <circle cx="1856" cy="1214" r="4" fill="#334155"/><text x="1872" y="1220" class="line">Network reachability ≠ authorization</text><circle cx="1856" cy="1245" r="4" fill="#334155"/><text x="1872" y="1251" class="line">Private Endpoint ≠ complete private access</text><circle cx="1856" cy="1276" r="4" fill="#334155"/><text x="1872" y="1282" class="line">Peering ≠ automatic hub inspection</text><circle cx="1856" cy="1307" r="4" fill="#334155"/><text x="1872" y="1313" class="line">ExpressRoute ≠ automatic encryption</text><circle cx="1856" cy="1338" r="4" fill="#334155"/><text x="1872" y="1344" class="line">Test DNS + routes + policy from client</text>
 <text x="2372" y="1386" text-anchor="end" class="small">OPEN GUIDE ↗</text></a><text x="70" y="1515" class="small">Typical pattern only. Validate service support, routing behavior, gateway transit, DNS forwarding, endpoint policies, SKU/region availability and security requirements.</text>
<text x="70" y="1550" class="small">Blue/green paths indicate logical connectivity; traffic traverses the firewall only when UDRs, peering and gateway settings actually steer it there.</text>
