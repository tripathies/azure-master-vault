  <text x="165" y="375" text-anchor="middle" font-size="16" fill="#9deeff">RBAC • Key Vault</text>
  <rect x="435" y="280" width="220" height="130" rx="17" fill="url(#panel)" stroke="#35d9ff" stroke-width="2"/>
  <text x="545" y="315" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Operations</text>
  <text x="545" y="348" text-anchor="middle" font-size="16" fill="#9deeff">Azure Monitor</text>
  <text x="545" y="375" text-anchor="middle" font-size="16" fill="#9deeff">Logs • Alerts</text>
  <rect x="55" y="465" width="260" height="155" rx="17" fill="url(#panel)" stroke="#35d9ff" stroke-width="2"/>
  <text x="185" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Application Workloads</text>
  <text x="185" y="535" text-anchor="middle" font-size="16" fill="#9deeff">App Service • Functions</text>
  <text x="185" y="563" text-anchor="middle" font-size="16" fill="#9deeff">Containers • Compute</text>
  <text x="185" y="591" text-anchor="middle" font-size="15" fill="#7bc9ec">LittleNest hands-on project</text>
  <rect x="395" y="465" width="260" height="155" rx="17" fill="url(#panel)" stroke="#35d9ff" stroke-width="2"/>
  <text x="525" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Data &amp; Connectivity</text>
  <text x="525" y="535" text-anchor="middle" font-size="16" fill="#9deeff">Cosmos DB • Storage</text>
  <text x="525" y="563" text-anchor="middle" font-size="16" fill="#9deeff">VNets • Private Endpoints</text>
  <text x="525" y="591" text-anchor="middle" font-size="15" fill="#7bc9ec">Private DNS • Terraform</text>
