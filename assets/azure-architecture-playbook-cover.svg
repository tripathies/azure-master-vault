<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Azure Architecture Playbook</title>
<desc id="desc">A readable conceptual Azure enterprise reference architecture showing global entry, landing-zone governance, shared identity and operations controls, primary and recovery regions, application and data services, private connectivity and cross-region resilience.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020d22"/><stop offset=".52" stop-color="#062b4b"/><stop offset="1" stop-color="#010918"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#91f5ff"/><stop offset=".5" stop-color="#21c8f1"/><stop offset="1" stop-color="#0878cf"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b426a"/><stop offset="1" stop-color="#061c36"/></linearGradient>
  <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#073e60"/><stop offset="1" stop-color="#061a32"/></linearGradient>
  <linearGradient id="recovery" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#282d68"/><stop offset="1" stop-color="#101a3b"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3b9ac7" stroke-opacity=".14" stroke-width="1"/></pattern>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#72eaff" stroke-width="1.5"/></marker>
  <marker id="arrowMint" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#72f4dc" stroke-width="1.5"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .section{font-size:18px;font-weight:800;letter-spacing:1.2px}
    .tileTitle{font-size:19px;font-weight:700;fill:#f4fbff}
    .tileSub{font-size:16px;fill:#bfeeff}
    .small{font-size:14px;fill:#a9d6ef}
    .flow{fill:none;stroke:#5bdef5;stroke-width:2.5;marker-end:url(#arrowCyan)}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<path d="M0 205H1600" stroke="#39b7e8" stroke-opacity=".26" stroke-width="2"/>
<g opacity=".16" fill="none" stroke="#1ca9df"><circle cx="1350" cy="100" r="260" stroke-dasharray="4 16"/><circle cx="1350" cy="100" r="215" stroke-dasharray="2 13"/><path d="M0 810H1600"/></g>
<!-- Brand header -->
<g>
  <text x="62" y="96" font-size="78" font-weight="900" letter-spacing="2" fill="url(#blue)" filter="url(#softGlow)">AZURE</text>
  <text x="360" y="93" font-size="55" font-weight="900" letter-spacing=".8" fill="#e9f6ff">ARCHITECTURE</text>
  <text x="880" y="93" font-size="58" font-weight="900" letter-spacing="1" fill="#ffffff">PLAYBOOK</text>
  <text x="67" y="151" font-size="29" font-weight="700" fill="#ecf9ff">From Cloud Fundamentals to</text>
  <text x="540" y="151" font-size="29" font-weight="700" fill="#68eaff">Enterprise-Grade Architecture</text>
  <rect x="1110" y="119" width="425" height="48" rx="24" fill="#052d4b" stroke="#46dafa" stroke-width="2"/>
  <text x="1322" y="150" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="1.5" fill="#d5faff">DESIGN  •  BUILD  •  SECURE  •  AUTOMATE</text>
  <text x="68" y="188" font-size="14" letter-spacing="3" fill="#66b8df">OPEN-SOURCE AZURE LEARNING &amp; IMPLEMENTATION PLAYBOOK</text>
</g>
<!-- Global entry -->
<g>
  <rect x="50" y="225" width="1500" height="102" rx="16" fill="#061d37" stroke="#35cbed" stroke-width="2"/>
  <text x="74" y="252" class="section" fill="#7deaff">01  GLOBAL / EDGE ENTRY</text>
  <rect x="75" y="266" width="410" height="46" rx="10" fill="url(#card)" stroke="#47dafa" stroke-width="1.5"/>
  <circle cx="103" cy="289" r="13" fill="#08618e" stroke="#92f4ff" stroke-width="1.5"/><path d="M95 289L103 281L111 289L103 297Z" fill="none" stroke="#e7fdff" stroke-width="1.8"/>
  <text x="129" y="286" class="tileTitle">Azure Traffic Manager</text><text x="129" y="303" class="small">DNS-based traffic routing and health probes</text>
  <path d="M495 289H555" class="flow"/>
  <rect x="570" y="266" width="440" height="46" rx="10" fill="url(#card)" stroke="#47dafa" stroke-width="1.5"/>
  <path d="M592 278L606 270L620 278V300L606 308L592 300Z" fill="#0874b3" stroke="#9af5ff" stroke-width="1.5"/><path d="M599 289H613M606 282V296" stroke="#e8fdff" stroke-width="1.6"/>
  <text x="635" y="286" class="tileTitle">Azure Front Door + WAF</text><text x="635" y="303" class="small">Global edge, TLS termination and web threat protection</text>
  <path d="M1020 289H1080" class="flow"/>
  <rect x="1095" y="266" width="430" height="46" rx="10" fill="url(#card)" stroke="#47dafa" stroke-width="1.5"/>
  <circle cx="1124" cy="289" r="14" fill="#075b89" stroke="#9af5ff" stroke-width="1.4"/><path d="M1124 276V302M1111 289H1137M1115 280L1133 298M1133 280L1115 298" stroke="#e7fdff" stroke-width="1.2"/>
  <text x="1152" y="286" class="tileTitle">Azure DNS</text><text x="1152" y="303" class="small">DNS zones, records and endpoint discovery</text>
</g>
<!-- Governance -->
<g>
  <rect x="50" y="341" width="1500" height="112" rx="16" fill="#1d2b35" stroke="#e6b85a" stroke-width="2"/>
  <text x="74" y="369" class="section" fill="#ffdc91">02  LANDING-ZONE GOVERNANCE</text>
  <rect x="75" y="382" width="345" height="54" rx="9" fill="#142e49" stroke="#d9b565" stroke-width="1.5"/><text x="247" y="405" text-anchor="middle" class="tileTitle">Management Groups</text><text x="247" y="424" text-anchor="middle" class="tileSub">Platform • Workloads • Sandbox</text>
  <rect x="440" y="382" width="345" height="54" rx="9" fill="#142e49" stroke="#d9b565" stroke-width="1.5"/><text x="612" y="405" text-anchor="middle" class="tileTitle">Subscriptions</text><text x="612" y="424" text-anchor="middle" class="tileSub">Connectivity • Identity • Online • Corp</text>
  <rect x="805" y="382" width="345" height="54" rx="9" fill="#142e49" stroke="#d9b565" stroke-width="1.5"/><text x="977" y="405" text-anchor="middle" class="tileTitle">Azure Policy + RBAC</text><text x="977" y="424" text-anchor="middle" class="tileSub">Guardrails • Least privilege • Compliance</text>
  <rect x="1170" y="382" width="355" height="54" rx="9" fill="#142e49" stroke="#d9b565" stroke-width="1.5"/><text x="1347" y="405" text-anchor="middle" class="tileTitle">Defender for Cloud</text><text x="1347" y="424" text-anchor="middle" class="tileSub">Security posture • Recommendations</text>
</g>
<!-- Shared platform -->
<g>
  <rect x="50" y="467" width="1500" height="84" rx="16" fill="#071a35" stroke="#568fc9" stroke-width="1.8"/>
  <text x="74" y="493" class="section" fill="#a8d6ff">03  SHARED PLATFORM SERVICES</text>
  <rect x="75" y="503" width="345" height="35" rx="8" fill="#0c3659" stroke="#4cb9e8"/><text x="247" y="526" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Microsoft Entra ID • MFA • PIM</text>
  <rect x="440" y="503" width="345" height="35" rx="8" fill="#0c3659" stroke="#4cb9e8"/><text x="612" y="526" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Hub VNet • VPN / ExpressRoute</text>
  <rect x="805" y="503" width="345" height="35" rx="8" fill="#0c3659" stroke="#4cb9e8"/><text x="977" y="526" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Key Vault • Secrets • Certificates</text>
  <rect x="1170" y="503" width="355" height="35" rx="8" fill="#0c3659" stroke="#4cb9e8"/><text x="1347" y="526" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Azure Monitor • Log Analytics • Alerts</text>
</g>
<!-- Primary region -->
<g>
  <rect x="50" y="568" width="735" height="258" rx="17" fill="url(#primary)" stroke="#35d9f5" stroke-width="2.5"/>
  <path d="M68 568H767Q785 568 785 586V603H50V586Q50 568 68 568Z" fill="#0a5a7d" opacity=".85"/>
  <text x="76" y="593" font-size="21" font-weight="800" fill="#e9fcff">REGION 1  •  PRIMARY WORKLOADS</text><text x="758" y="592" text-anchor="end" font-size="14" font-weight="700" fill="#9fefff">ONLINE SUBSCRIPTION</text>
  <rect x="75" y="616" width="325" height="91" rx="11" fill="url(#card)" stroke="#52dbf5" stroke-width="1.7"/>
  <text x="94" y="642" font-size="20" font-weight="800" fill="#fff">Application Platform</text><text x="94" y="669" font-size="17" fill="#bfefff">Application Gateway • WAF</text><text x="94" y="691" font-size="17" fill="#bfefff">App Service • Functions • AI Foundry</text>
  <rect x="420" y="616" width="340" height="91" rx="11" fill="url(#card)" stroke="#52dbf5" stroke-width="1.7"/>
  <text x="439" y="642" font-size="20" font-weight="800" fill="#fff">Compute &amp; Containers</text><text x="439" y="669" font-size="17" fill="#bfefff">Virtual Machines • Container Apps</text><text x="439" y="691" font-size="17" fill="#bfefff">AKS • ACR • VM Scale Sets</text>
  <rect x="75" y="721" width="325" height="91" rx="11" fill="url(#card)" stroke="#52dbf5" stroke-width="1.7"/>
  <text x="94" y="747" font-size="20" font-weight="800" fill="#fff">Data &amp; Storage</text><text x="94" y="774" font-size="17" fill="#bfefff">Azure SQL • Cosmos DB</text><text x="94" y="796" font-size="17" fill="#bfefff">Blob Storage • Queue Storage</text>
  <rect x="420" y="721" width="340" height="91" rx="11" fill="url(#card)" stroke="#52dbf5" stroke-width="1.7"/>
  <text x="439" y="747" font-size="20" font-weight="800" fill="#fff">Private Connectivity</text><text x="439" y="774" font-size="17" fill="#bfefff">Spoke VNets • NSGs • Private Link</text><text x="439" y="796" font-size="17" fill="#bfefff">Private Endpoints • Private DNS</text>
</g>
<!-- Recovery region -->
<g>
  <rect x="815" y="568" width="735" height="258" rx="17" fill="url(#recovery)" stroke="#9297ff" stroke-width="2.5"/>
  <path d="M833 568H1532Q1550 568 1550 586V603H815V586Q815 568 833 568Z" fill="#3a448e" opacity=".85"/>
  <text x="841" y="593" font-size="21" font-weight="800" fill="#f0f0ff">REGION 2  •  RECOVERY / SECONDARY</text><text x="1523" y="592" text-anchor="end" font-size="14" font-weight="700" fill="#c9caff">DR SUBSCRIPTION</text>
  <rect x="840" y="616" width="325" height="91" rx="11" fill="#171f4b" stroke="#9b9dff" stroke-width="1.7"/>
  <text x="859" y="642" font-size="20" font-weight="800" fill="#fff">Application Recovery</text><text x="859" y="669" font-size="17" fill="#d5dcff">Front Door health-based failover</text><text x="859" y="691" font-size="17" fill="#d5dcff">App Service / AKS standby</text>
  <rect x="1185" y="616" width="340" height="91" rx="11" fill="#171f4b" stroke="#9b9dff" stroke-width="1.7"/>
  <text x="1204" y="642" font-size="20" font-weight="800" fill="#fff">Recovery Compute</text><text x="1204" y="669" font-size="17" fill="#d5dcff">VM Scale Sets • AKS capacity</text><text x="1204" y="691" font-size="17" fill="#d5dcff">Images • Infrastructure as Code</text>
  <rect x="840" y="721" width="325" height="91" rx="11" fill="#171f4b" stroke="#9b9dff" stroke-width="1.7"/>
  <text x="859" y="747" font-size="20" font-weight="800" fill="#fff">Data Resilience</text><text x="859" y="774" font-size="17" fill="#d5dcff">SQL geo-replication • Cosmos DB</text><text x="859" y="796" font-size="17" fill="#d5dcff">GRS / GZRS storage options</text>
  <rect x="1185" y="721" width="340" height="91" rx="11" fill="#171f4b" stroke="#9b9dff" stroke-width="1.7"/>
  <text x="1204" y="747" font-size="20" font-weight="800" fill="#fff">Recovery Operations</text><text x="1204" y="774" font-size="17" fill="#d5dcff">Azure Backup • Site Recovery</text><text x="1204" y="796" font-size="17" fill="#d5dcff">Monitor • Alerts • Runbooks</text>
</g>
<!-- Cross-region flow and footer -->
<path d="M385 842H1215" stroke="#72f4dc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowMint)" fill="none"/>
<text x="800" y="866" text-anchor="middle" font-size="16" font-weight="800" fill="#8affea">CROSS-REGION DATA REPLICATION  •  BACKUP  •  FAILOVER</text>
<text x="800" y="891" text-anchor="middle" font-size="12.5" letter-spacing="1" fill="#9bc9e4">CONCEPTUAL REFERENCE • VERIFY SERVICE AVAILABILITY, REGIONAL PAIRS, SECURITY AND RECOVERY TARGETS BEFORE IMPLEMENTATION</text>
</svg>