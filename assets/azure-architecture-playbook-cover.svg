<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="857" viewBox="0 0 1536 857" role="img" aria-labelledby="title desc">
<title id="title">Azure Architecture Playbook</title>
<desc id="desc">A conceptual Azure learning and architecture banner, from cloud fundamentals to enterprise-grade architecture.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03152f"/><stop offset=".55" stop-color="#05294a"/><stop offset="1" stop-color="#020d20"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9ffaff"/><stop offset=".42" stop-color="#18c8f5"/><stop offset="1" stop-color="#0874d9"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9d9f5"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3d67" stop-opacity=".95"/><stop offset="1" stop-color="#061a37" stop-opacity=".95"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#2c86ba" stroke-opacity=".17" stroke-width="1"/></pattern>
</defs>
<rect width="1536" height="857" fill="url(#bg)"/><rect width="1536" height="857" fill="url(#grid)"/>
<g opacity=".25" fill="none" stroke="#18b9ef"><path d="M0 160H1536M0 710H1536"/><circle cx="820" cy="430" r="390" stroke-dasharray="4 14"/><circle cx="820" cy="430" r="330" stroke-dasharray="2 18"/></g>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="68" y="205" font-size="116" font-weight="800" letter-spacing="3" fill="url(#cyan)" filter="url(#glow)">AZURE</text>
  <text x="68" y="310" font-size="76" font-weight="800" letter-spacing="1" fill="url(#white)">ARCHITECTURE</text>
  <text x="68" y="405" font-size="90" font-weight="800" letter-spacing="1" fill="url(#white)">PLAYBOOK</text>
  <path d="M70 438H690" stroke="#28d9ff" stroke-width="3" filter="url(#glow)"/>
  <text x="70" y="510" font-size="37" font-weight="700" fill="#eaf8ff">From Cloud Fundamentals to</text>
  <text x="70" y="558" font-size="37" font-weight="700" fill="#65eaff">Enterprise-Grade Architecture</text>
  <rect x="68" y="635" width="610" height="80" rx="40" fill="#062c4b" stroke="#43ddff" stroke-width="3"/>
  <text x="373" y="686" text-anchor="middle" font-size="27" font-weight="700" letter-spacing="3" fill="#c5faff">LEARN  •  DESIGN  •  BUILD  •  SECURE</text>
  <text x="70" y="780" font-size="20" letter-spacing="4" fill="#4fa8d8">OPEN-SOURCE CLOUD ARCHITECTURE KNOWLEDGE</text>
</g>
<g transform="translate(760 90)" font-family="Arial,Helvetica,sans-serif">
  <rect x="0" y="95" width="710" height="610" rx="28" fill="#04172e" stroke="#27cfff" stroke-width="2.5" opacity=".98"/>
  <g fill="none" stroke="#25cafa" stroke-width="3" opacity=".95"><path d="M355 70V125M355 210V260M355 360V405M355 510V550"/><path d="M355 260H165V310M355 260H545V310M165 410V450M545 410V450"/></g>
  <g filter="url(#glow)">
    <path d="M275 80c-7-31 18-57 48-55 15-34 65-34 82 0 34-4 57 22 50 55-4 17-20 27-39 27H310c-18 0-31-10-35-27Z" fill="url(#cyan)" stroke="#a3f7ff" stroke-width="2"/>
    <text x="355" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#03203c">AZURE</text>
  </g>
  <rect x="190" y="135" width="330" height="76" rx="15" fill="url(#panel)" stroke="#35d9ff" stroke-width="2"/>
  <text x="355" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Governance &amp; Subscriptions</text>
  <text x="355" y="192" text-anchor="middle" font-size="15" fill="#9deeff">Management Groups • Policy • RBAC</text>
