<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Azure hub and spoke network reference architecture</title><desc id="desc">Conceptual network topology showing internet ingress, hybrid connectivity, hub firewall, spoke VNets, private endpoints, private DNS and controlled egress.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#496a86"/></marker><marker id="greenArrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16845b"/></marker></defs>
<rect width="1400" height="900" fill="#f5f8fc"/>
<text x="48" y="48" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#17365d">C · Networking &amp; Private Connectivity</text>
<text x="48" y="78" font-family="Segoe UI,Arial" font-size="16" fill="#526579">Reference pattern · hub-and-spoke, hybrid access, private PaaS connectivity and controlled egress</text>
<!-- Internet edge -->
<rect x="48" y="120" width="1304" height="100" rx="18" fill="#e7f2ff" stroke="#8bb9e8" stroke-width="2"/>
<text x="70" y="148" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#174a7e">PUBLIC / EXTERNAL EDGE</text>
<rect x="90" y="163" width="190" height="42" rx="9" fill="#fff" stroke="#4386c6" stroke-width="2"/><text x="185" y="189" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#20364d">Users / Internet</text>
<rect x="350" y="163" width="220" height="42" rx="9" fill="#fff" stroke="#4386c6" stroke-width="2"/><text x="460" y="189" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#20364d">Front Door (optional)</text>
<rect x="640" y="163" width="240" height="42" rx="9" fill="#fff" stroke="#4386c6" stroke-width="2"/><text x="760" y="189" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#20364d">Application Gateway / WAF</text>
<path d="M280 184 H344 M570 184 H634" fill="none" stroke="#496a86" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M760 205 V260 H710 V320" fill="none" stroke="#496a86" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="780" y="249" font-family="Segoe UI,Arial" font-size="12" fill="#526579">regional ingress, if required</text>
<!-- hybrid -->
<rect x="48" y="270" width="250" height="110" rx="14" fill="#fff" stroke="#8b9bad" stroke-width="2"/>
<text x="173" y="300" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#20364d">On-premises</text>
<text x="173" y="323" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#526579">Corporate network</text>
<text x="173" y="345" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#526579">Routes + DNS forwarding</text>
<rect x="330" y="270" width="250" height="110" rx="14" fill="#fff" stroke="#8b9bad" stroke-width="2"/>
<text x="455" y="300" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#20364d">Hybrid gateway</text>
<text x="455" y="325" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#526579">VPN Gateway OR</text>
<text x="455" y="346" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#526579">ExpressRoute Gateway</text>
<path d="M298 325 H324" fill="none" stroke="#496a86" stroke-width="2.5" marker-end="url(#arrow)"/>
<!-- hub boundary -->
<rect x="620" y="280" width="330" height="390" rx="20" fill="#eaf3ff" stroke="#2675b8" stroke-width="2.5"/>
<text x="642" y="310" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#174a7e">HUB VNET</text>
<text x="642" y="333" font-family="Segoe UI,Arial" font-size="12" fill="#526579">Shared connectivity services</text>
<rect x="660" y="355" width="250" height="58" rx="10" fill="#fff" stroke="#2675b8" stroke-width="2"/>
<text x="785" y="380" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#20364d">Azure Firewall</text><text x="785" y="399" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#526579">Central inspection / policy</text>
<rect x="660" y="438" width="250" height="58" rx="10" fill="#fff" stroke="#2675b8" stroke-width="2"/>
<text x="785" y="462" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#20364d">Route tables (UDRs)</text><text x="785" y="481" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#526579">Explicit next-hop decisions</text>
<rect x="660" y="521" width="250" height="58" rx="10" fill="#fff" stroke="#2675b8" stroke-width="2"/>
<text x="785" y="545" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#20364d">Private DNS resolver / DNS</text><text x="785" y="564" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#526579">Name resolution design</text>
<rect x="660" y="604" width="250" height="42" rx="9" fill="#e0f4e9" stroke="#16845b" stroke-width="2"/>
<text x="785" y="630" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#155d42">NAT Gateway (egress where suitable)</text>
<path d="M580 325 H614" fill="none" stroke="#496a86" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M785 320 V349" fill="none" stroke="#496a86" stroke-width="2.5" marker-end="url(#arrow)"/>
<!-- spokes -->
<rect x="1010" y="270" width="342" height="182" rx="18" fill="#fff" stroke="#7b91a8" stroke-width="2"/>
<text x="1032" y="300" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#20364d">APPLICATION SPOKE VNET</text>
<rect x="1035" y="321" width="135" height="55" rx="9" fill="#e7f2ff" stroke="#4386c6" stroke-width="1.8"/><text x="1102" y="344" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#20364d">App subnet</text><text x="1102" y="361" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#526579">NSG + ASG</text>
<rect x="1190" y="321" width="135" height="55" rx="9" fill="#fff4e5" stroke="#d18b24" stroke-width="1.8"/><text x="1257" y="344" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#704610">Ingress subnet</text><text x="1257" y="361" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#704610">if regional WAF</text>
<text x="1035" y="410" font-family="Segoe UI,Arial" font-size="12" fill="#526579">Spoke peering + UDRs define paths</text>
<rect x="1010" y="492" width="342" height="178" rx="18" fill="#fff" stroke="#7b91a8" stroke-width="2"/>
<text x="1032" y="522" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#20364d">DATA / PRIVATE SERVICES</text>
<rect x="1035" y="543" width="135" height="55" rx="9" fill="#f0eaff" stroke="#8966c7" stroke-width="1.8"/><text x="1102" y="566" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#4d3679">Private Endpoint</text><text x="1102" y="584" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#4d3679">consumer subnet</text>
<rect x="1190" y="543" width="135" height="55" rx="9" fill="#e0f4e9" stroke="#16845b" stroke-width="1.8"/><text x="1257" y="566" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#155d42">PaaS target</text><text x="1257" y="584" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#155d42">Storage / SQL etc.</text>
<path d="M1170 570 H1184" fill="none" stroke="#16845b" stroke-width="2.5" marker-end="url(#greenArrow)"/>
<text x="1035" y="632" font-family="Segoe UI,Arial" font-size="12" fill="#526579">Private DNS zone + VNet link required</text>
<!-- connectivity links -->
<path d="M950 380 H980 V348 H1004" fill="none" stroke="#496a86" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="955" y="367" font-family="Segoe UI,Arial" font-size="11" fill="#526579">peering</text>
<path d="M950 555 H980 V570 H1004" fill="none" stroke="#16845b" stroke-width="2.5" marker-end="url(#greenArrow)"/>
<path d="M1102 452 V486" fill="none" stroke="#496a86" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<!-- legend/footer -->
<rect x="48" y="715" width="1304" height="135" rx="16" fill="#fff" stroke="#d4dee8" stroke-width="1.5"/>
<text x="72" y="746" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#17365d">Design checks before implementation</text>
<text x="72" y="775" font-family="Segoe UI,Arial" font-size="13" fill="#334e68">• Use non-overlapping CIDRs; document subnet purpose, NSGs, route tables and peering.</text>
<text x="72" y="799" font-family="Segoe UI,Arial" font-size="13" fill="#334e68">• Private Endpoint does not configure DNS or guarantee isolation by itself; validate FQDN resolution and service public-access settings.</text>
<text x="72" y="823" font-family="Segoe UI,Arial" font-size="13" fill="#334e68">• Choose VPN vs ExpressRoute, Firewall vs NVA, and NAT egress from requirements; verify symmetric routing, throughput and failure paths.</text>
<text x="48" y="880" font-family="Segoe UI,Arial" font-size="12" fill="#66788a">Conceptual reference pattern. Optional services are shown as choices; confirm current Azure capabilities, limits, routing behavior and service-specific guidance.</text>
</svg>