<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#496a86"/></marker></defs><rect width="1200" height="760" fill="#f5f8fc"/><text x="40" y="44" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#17365d">Virtual Network (VNet) · Component design</text><text x="40" y="73" font-family="Segoe UI,Arial" font-size="15" fill="#526579">Address space, subnet boundaries, security controls, routing, peering and private service access</text>
<rect x="40" y="110" width="1120" height="575" rx="20" fill="#eaf3ff" stroke="#2675b8" stroke-width="3"/><text x="65" y="145" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#174a7e">VNET ADDRESS SPACE · example only: 10.20.0.0/16</text>
<rect x="75" y="180" width="320" height="175" rx="14" fill="#fff" stroke="#4386c6" stroke-width="2"/><text x="95" y="211" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#20364d">Ingress subnet</text><text x="95" y="236" font-family="Segoe UI,Arial" font-size="13" fill="#526579">Example: 10.20.1.0/24</text><rect x="95" y="258" width="280" height="70" rx="9" fill="#fff4e5" stroke="#d18b24" stroke-width="1.5"/><text x="235" y="285" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#704610">Application Gateway / WAF</text><text x="235" y="306" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#704610">Dedicated subnet where required</text>
<rect x="440" y="180" width="320" height="175" rx="14" fill="#fff" stroke="#4386c6" stroke-width="2"/><text x="460" y="211" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#20364d">Application subnet</text><text x="460" y="236" font-family="Segoe UI,Arial" font-size="13" fill="#526579">Example: 10.20.2.0/24</text><rect x="460" y="258" width="280" height="70" rx="9" fill="#e7f2ff" stroke="#4386c6" stroke-width="1.5"/><text x="600" y="285" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#20364d">Workload instances</text><text x="600" y="306" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#526579">NSG + optional ASG + UDR</text>
<rect x="805" y="180" width="320" height="175" rx="14" fill="#fff" stroke="#4386c6" stroke-width="2"/><text x="825" y="211" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#20364d">Private endpoint subnet</text><text x="825" y="236" font-family="Segoe UI,Arial" font-size="13" fill="#526579">Example: 10.20.3.0/24</text><rect x="825" y="258" width="280" height="70" rx="9" fill="#f0eaff" stroke="#8966c7" stroke-width="1.5"/><text x="965" y="285" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#4d3679">Private Endpoint NIC</text><text x="965" y="306" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#4d3679">Service-specific DNS mapping</text>
<path d="M395 293 H434 M760 293 H799" stroke="#496a86" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect x="75" y="395" width="320" height="115" rx="12" fill="#fff" stroke="#7b91a8" stroke-width="1.8"/><text x="95" y="425" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#20364d">Routing</text><text x="95" y="451" font-family="Segoe UI,Arial" font-size="13" fill="#526579">UDRs → firewall/NVA where intended</text><text x="95" y="475" font-family="Segoe UI,Arial" font-size="13" fill="#526579">Check symmetry and effective routes</text>
<rect x="440" y="395" width="320" height="115" rx="12" fill="#fff" stroke="#7b91a8" stroke-width="1.8"/><text x="460" y="425" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#20364d">Security boundaries</text><text x="460" y="451" font-family="Segoe UI,Arial" font-size="13" fill="#526579">NSGs filter subnet/NIC traffic</text><text x="460" y="475" font-family="Segoe UI,Arial" font-size="13" fill="#526579">ASGs group supported workload NICs</text>
<rect x="805" y="395" width="320" height="115" rx="12" fill="#fff" stroke="#7b91a8" stroke-width="1.8"/><text x="825" y="425" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#20364d">Name resolution</text><text x="825" y="451" font-family="Segoe UI,Arial" font-size="13" fill="#526579">Private DNS zone + VNet link</text><text x="825" y="475" font-family="Segoe UI,Arial" font-size="13" fill="#526579">Validate FQDN from consumer subnet</text>
<rect x="75" y="540" width="1050" height="100" rx="12" fill="#fff" stroke="#b9c9d8" stroke-width="1.5"/><text x="95" y="570" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#17365d">VNet-level dependencies and controls</text><text x="95" y="596" font-family="Segoe UI,Arial" font-size="13" fill="#334e68">Peering / VPN / ExpressRoute · DNS design · address-space non-overlap · policy and RBAC · flow logs / monitoring · quota and subnet sizing</text><text x="95" y="619" font-family="Segoe UI,Arial" font-size="13" fill="#334e68">Private endpoints do not automatically create DNS records, routes or complete network isolation.</text><text x="40" y="725" font-family="Segoe UI,Arial" font-size="12" fill="#66788a">CIDRs are illustrative only. Subnet names, sizes and dedicated-subnet requirements must be validated against the selected Azure services.</text></svg>