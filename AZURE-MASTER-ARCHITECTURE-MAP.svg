<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1620" viewBox="0 0 2600 1620">
<title>Azure Enterprise Architecture Map — Cloud Architecture Playbook</title>
<desc>Nine architecture views cover all 14 catalogue categories and 120 unique topics, including separate DevOps, AI and business recovery categories. Created by Rahul Tripathi.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFE"/><stop offset="1" stop-color="#E9F2FA"/></linearGradient><linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#063D70"/><stop offset="1" stop-color="#1176B8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17334B" flood-opacity=".12"/></filter><style>
.title{font:800 56px 'Segoe UI',Arial,sans-serif;fill:#FFFFFF;letter-spacing:1px}
.sub{font:400 23px 'Segoe UI',Arial,sans-serif;fill:#DCEEFF}
.meta{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#FFFFFF}
.cardtitle{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#142E46}
.cardid{font:800 20px 'Segoe UI',Arial,sans-serif;fill:#FFFFFF}
.desc{font:500 19px 'Segoe UI',Arial,sans-serif;fill:#435B70}
.foot{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#526C80}
</style></defs>
<rect width="2600" height="1620" fill="url(#bg)"/>
<rect width="2600" height="190" fill="url(#header)"/>
