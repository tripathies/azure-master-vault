<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">LittleNest Kidswear Profile A architecture</title><desc id="desc">A low-cost non-production Azure lab with private web app, Functions Flex Consumption, Cosmos DB Free Tier, private Key Vault and Storage, managed identities, and optional Container Apps and Front Door.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102d49"/><stop offset="1" stop-color="#09182a"/></linearGradient><linearGradient id="accent"><stop stop-color="#62e0ed"/><stop offset="1" stop-color="#7faaff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#6bbadf" stroke-width="1.3"/></marker></defs><rect width="1120" height="680" rx="22" fill="#071426"/><rect x="1" y="1" width="1118" height="678" rx="21" fill="none" stroke="#294964"/><text x="42" y="48" fill="#edf6ff" font-family="Segoe UI,Arial" font-size="25" font-weight="700">LITTLENEST KIDSWEAR · PROFILE A</text><text x="42" y="75" fill="#a9bfd5" font-family="Segoe UI,Arial" font-size="14">Low-cost learning lab · Single non-production subscription · Private service access</text><rect x="34" y="106" width="1052" height="530" rx="18" fill="#0a1a2c" stroke="#385a77" stroke-dasharray="7 6"/><text x="55" y="137" fill="#69d8f0" font-family="Segoe UI,Arial" font-size="15" font-weight="700">NON-PRODUCTION WORKLOAD SUBSCRIPTION</text><rect x="65" y="165" width="990" height="430" rx="16" fill="#0e2339" stroke="#3f6b8e"/><text x="88" y="194" fill="#a9bfd5" font-family="Segoe UI,Arial" font-size="13">littlenest-nonprod-vnet · private endpoint and app integration subnets</text><rect x="92" y="224" width="255" height="120" rx="13" fill="#123a54" stroke="#59bfdc"/><text x="219" y="255" text-anchor="middle" fill="#6de1ed" font-family="Segoe UI,Arial" font-size="13" font-weight="700">PRESENTATION</text><text x="219" y="283" text-anchor="middle" fill="#f1f7ff" font-family="Segoe UI,Arial" font-size="20" font-weight="700">App Service Web</text><text x="219" y="308" text-anchor="middle" fill="#b7cee3" font-family="Segoe UI,Arial" font-size="12">Basic+ plan · Private Endpoint</text><rect x="430" y="224" width="255" height="120" rx="13" fill="#153a35" stroke="#61cda3"/><text x="557" y="255" text-anchor="middle" fill="#8fe0bd" font-family="Segoe UI,Arial" font-size="13" font-weight="700">APPLICATION</text><text x="557" y="283" text-anchor="middle" fill="#f1f7ff" font-family="Segoe UI,Arial" font-size="20" font-weight="700">Functions Flex</text><text x="557" y="308" text-anchor="middle" fill="#b7cee3" font-family="Segoe UI,Arial" font-size="12">Private Endpoint + VNet integration</text><rect x="768" y="224" width="255" height="120" rx="13" fill="#30294b" stroke="#a995ed"/><text x="895" y="255" text-anchor="middle" fill="#c4b3ff" font-family="Segoe UI,Arial" font-size="13" font-weight="700">OPTIONAL EXTENSION</text><text x="895" y="283" text-anchor="middle" fill="#f1f7ff" font-family="Segoe UI,Arial" font-size="20" font-weight="700">Container Apps</text><text x="895" y="308" text-anchor="middle" fill="#b7cee3" font-family="Segoe UI,Arial" font-size="12">Consumption · internal ingress</text><path d="M347 284H430M685 284H768" stroke="#6bbadf" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="92" y="395" width="255" height="124" rx="13" fill="#342b1a" stroke="#cda65d"/><text x="219" y="427" text-anchor="middle" fill="#f6cb7a" font-family="Segoe UI,Arial" font-size="13" font-weight="700">DATA</text><text x="219" y="455" text-anchor="middle" fill="#f1f7ff" font-family="Segoe UI,Arial" font-size="20" font-weight="700">Cosmos DB</text><text x="219" y="480" text-anchor="middle" fill="#b7cee3" font-family="Segoe UI,Arial" font-size="12">Free Tier · 1,000 RU/s / 25 GB</text><rect x="430" y="395" width="255" height="124" rx="13" fill="#17354d" stroke="#5fa8